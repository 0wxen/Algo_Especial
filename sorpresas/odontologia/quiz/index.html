<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9f4f1">
<title>Quiz de la doctora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script>
  // ✏️ PERSONALIZA AQUÍ ----------------------------------------------
  const NOMBRE = 'Carola';
  const FIRMA = 'Owen';
  const POR_RONDA = 5;   // preguntas por ronda
  // p = pregunta, r = respuestas. ⚠️ La PRIMERA respuesta es la correcta (en pantalla se revuelven solas).
  const PREGUNTAS = [
    { p: '¿Cuántos dientes tiene la dentición permanente completa?', r: ['32', '28', '20', '36'] },
    { p: '¿Cuántos dientes temporales (de leche) hay?', r: ['20', '24', '16', '32'] },
    { p: '¿Cuál es el tejido más duro del cuerpo humano?', r: ['Esmalte', 'Dentina', 'Hueso', 'Cemento'] },
    { p: '¿Qué tejido forma la mayor parte del diente?', r: ['Dentina', 'Esmalte', 'Pulpa', 'Cemento'] },
    { p: '¿Dónde están los nervios y vasos sanguíneos del diente?', r: ['En la pulpa', 'En el esmalte', 'En la dentina', 'En la encía'] },
    { p: '¿Qué bacteria se asocia principalmente con la caries?', r: ['Streptococcus mutans', 'Escherichia coli', 'Helicobacter pylori', 'Staphylococcus aureus'] },
    { p: '¿Qué mineral se agrega a las pastas para prevenir caries?', r: ['Flúor', 'Hierro', 'Magnesio', 'Zinc'] },
    { p: 'En la nomenclatura FDI, ¿qué diente es el 11?', r: ['Incisivo central superior derecho', 'Incisivo central superior izquierdo', 'Canino superior derecho', 'Primer molar inferior derecho'] },
    { p: 'En la nomenclatura FDI, ¿qué número tiene el cuadrante inferior izquierdo?', r: ['3', '1', '2', '4'] },
    { p: '¿Cómo se llaman las "muelas del juicio"?', r: ['Terceros molares', 'Segundos molares', 'Premolares', 'Caninos'] },
    { p: '¿Qué tejido cubre la raíz del diente?', r: ['Cemento', 'Esmalte', 'Pulpa', 'Encía'] },
    { p: '¿Cómo se llama la inflamación de la encía?', r: ['Gingivitis', 'Pulpitis', 'Halitosis', 'Bruxismo'] },
    { p: '¿Cómo se llama apretar o rechinar los dientes?', r: ['Bruxismo', 'Gingivitis', 'Fluorosis', 'Maloclusión'] },
    { p: '¿Cómo se le dice al mal aliento?', r: ['Halitosis', 'Xerostomía', 'Gingivitis', 'Bruxismo'] },
    { p: '¿Qué diente suele tener la raíz más larga?', r: ['Canino superior', 'Incisivo central inferior', 'Primer molar superior', 'Segundo premolar inferior'] },
    { p: '¿A qué edad aproximada sale el primer molar permanente?', r: ['A los 6 años', 'A los 12 años', 'A los 3 años', 'A los 18 años'] },
    { p: '¿Qué especialidad se encarga de los brackets?', r: ['Ortodoncia', 'Endodoncia', 'Periodoncia', 'Prostodoncia'] },
    { p: '¿Qué especialidad hace los tratamientos de conductos?', r: ['Endodoncia', 'Ortodoncia', 'Periodoncia', 'Odontopediatría'] },
    { p: '¿Qué especialidad atiende a los niños?', r: ['Odontopediatría', 'Periodoncia', 'Prostodoncia', 'Endodoncia'] },
    { p: '¿Qué especialidad trata encías y tejidos de soporte?', r: ['Periodoncia', 'Ortodoncia', 'Endodoncia', 'Prostodoncia'] },
    { p: '¿Qué es la placa dentobacteriana?', r: ['Una biopelícula de bacterias', 'Una capa de esmalte nuevo', 'Un tipo de resina', 'Un hueso de la mandíbula'] },
    { p: '¿Cómo se llama la placa que se mineraliza?', r: ['Cálculo (sarro)', 'Caries', 'Fluorosis', 'Esmalte'] },
    { p: '¿Cuántas raíces suele tener el primer molar superior?', r: ['3', '1', '2', '4'] },
    { p: '¿Cuántas raíces suele tener el primer molar inferior?', r: ['2', '1', '3', '4'] },
    { p: '¿Cuánto tiempo se recomienda cepillarse los dientes?', r: ['2 minutos', '30 segundos', '10 minutos', '5 segundos'] },
    { p: '¿Cada cuánto se recomienda cambiar el cepillo?', r: ['Cada 3 meses', 'Cada año', 'Cada semana', 'Nunca'] },
    { p: '¿Qué cara del diente mira hacia la línea media?', r: ['Mesial', 'Distal', 'Oclusal', 'Vestibular'] },
    { p: '¿Cómo se llama la cara de masticación de molares y premolares?', r: ['Oclusal', 'Incisal', 'Lingual', 'Cervical'] },
    { p: '¿Qué cara de los dientes inferiores mira hacia la lengua?', r: ['Lingual', 'Vestibular', 'Mesial', 'Distal'] },
    { p: '¿Cómo se le dice también a los dientes de leche?', r: ['Deciduos', 'Permanentes', 'Supernumerarios', 'Impactados'] },
    { p: '¿En qué hueso están los dientes superiores?', r: ['Maxilar', 'Mandíbula', 'Hioides', 'Temporal'] },
    { p: '¿Quién es tu paciente favorito? 😌', r: ['Owen, obvio', 'Snoopy', 'Un señor random', 'Nadie'] },
  ];
  // Cuando contesta bien, le sale uno de estos (en orden, sin repetir)
  const PIROPOS = [
    '¡Correcto! Qué inteligente eres, me encanta 🧠💗',
    '¡Bien! Futura doctora nivel experta 🩺',
    '¡Eso! Tus pacientes van a estar en buenas manos.',
    '¡Correctísimo! Y además bonita, injusto 😤',
    '¡Sí! Ni el libro lo explica tan bien como tú.',
    '¡Bien! Cada día más cerca de ser la Dra. ' + NOMBRE + ' ✨',
    '¡Correcto! Snoopy te aplaude 🐶👏',
    '¡Exacto! Me encanta cuando sabes todo.',
    '¡Muy bien! Así se estudia 📚',
    '¡Correcto! Qué orgulloso estoy de ti.',
    '¡Bien! Tu cerebro también es mi parte favorita 💗',
    '¡Sí! Vas a ser la mejor dentista de Puebla 🦷',
  ];
  // -------------------------------------------------------------------
</script>
<style>
  :root { --bg1: #e6faf7; --bg2: #ffe3ec; --ink: #233a3d; --muted: #5d7275; --teal: #12a594; --red: #e8174f; --ok: #22b573; --mal: #f05a6e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: linear-gradient(180deg, var(--bg1), var(--bg2)); background-attachment: fixed;
    color: var(--ink); font-family: "Quicksand", system-ui, sans-serif;
    min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: max(52px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  h1 { font-family: "Caveat", cursive; color: var(--teal); font-size: clamp(2.5rem, 10.5vw, 3.3rem); margin: 0; line-height: 1; }
  .sub { color: var(--muted); margin: 6px 0 14px; }
  .card { width: min(100%, 440px); background: #fff; border-radius: 22px; padding: 18px; box-shadow: 0 10px 30px rgba(18, 165, 148, .15); }
  .barra { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .barra i { width: 26px; height: 8px; border-radius: 4px; background: #e2ecec; }
  .barra i.ok { background: var(--ok); } .barra i.mal { background: var(--mal); } .barra i.ahora { background: var(--teal); opacity: .5; }
  .num { color: var(--muted); font-size: .85rem; font-weight: 700; letter-spacing: .5px; }
  .preg { font-size: clamp(1.1rem, 4.6vw, 1.3rem); font-weight: 700; margin: 6px 0 14px; line-height: 1.35; }
  .ops { display: grid; gap: 8px; }
  .ops button {
    font: inherit; font-weight: 700; text-align: left; padding: 12px 14px; border-radius: 14px; cursor: pointer;
    border: 2px solid #d5e7e5; background: #f7fbfb; color: var(--ink); transition: transform .1s, background .2s, border-color .2s;
  }
  .ops button:active { transform: scale(.98); }
  .ops button:disabled { cursor: default; }
  .ops button.ok { background: #e3f8ec; border-color: var(--ok); }
  .ops button.mal { background: #fde8eb; border-color: var(--mal); }
  .feedback { min-height: 0; margin-top: 12px; font-family: "Caveat", cursive; font-size: 1.5rem; line-height: 1.15; }
  .feedback.ok { color: var(--ok); } .feedback.mal { color: var(--mal); }
  .btn { font: inherit; font-weight: 700; margin-top: 14px; padding: 12px 22px; border-radius: 999px; border: 0; background: var(--teal); color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(18, 165, 148, .35); }
  .btn[hidden] { display: none; }
  .final .grande { font-size: 3rem; line-height: 1; margin: 4px 0; }
  .final .score { font-size: 2.4rem; font-weight: 700; color: var(--teal); }
  .final .msj { font-family: "Caveat", cursive; font-size: 1.6rem; line-height: 1.15; margin: 8px 0 0; }
  .firma { font-family: "Caveat", cursive; color: var(--red); font-size: 1.5rem; margin: 6px 0 0; }
  .pop { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <h1>Quiz de la doctora</h1>
  <p class="sub" id="sub"></p>
  <div class="card" id="card"></div>

<script>
  const $ = id => document.getElementById(id);
  $('sub').textContent = 'Para la futura Dra. ' + NOMBRE + ' 🦷';

  // Orden revuelto guardado en su celular para que no se repitan hasta acabar todas
  const KEY = 'quiz-odonto';
  let est = {};
  try { est = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(est)); } catch (e) {} };
  const revolver = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  if (!Array.isArray(est.orden) || est.orden.length !== PREGUNTAS.length) { est.orden = revolver(PREGUNTAS.map((_, i) => i)); est.pos = 0; }
  est.piropo = est.piropo || 0; est.rondas = est.rondas || 0;

  function tomarPreguntas() {
    const n = Math.min(POR_RONDA, PREGUNTAS.length), lista = [];
    while (lista.length < n) {
      if (est.pos >= est.orden.length) { est.orden = revolver(PREGUNTAS.map((_, i) => i)); est.pos = 0; }
      const k = est.orden[est.pos++];
      if (!lista.includes(k)) lista.push(k);
    }
    guardar();
    return lista;
  }

  let ronda, paso, resultados;
  const card = $('card');

  function nuevaRonda() { ronda = tomarPreguntas(); paso = 0; resultados = []; pintar(); }

  function barra() {
    return '<div class="barra">' + ronda.map((_, i) =>
      '<i class="' + (resultados[i] === true ? 'ok' : resultados[i] === false ? 'mal' : i === paso ? 'ahora' : '') + '"></i>').join('') + '</div>';
  }

  function pintar() {
    const q = PREGUNTAS[ronda[paso]];
    const ops = revolver(q.r.map((t, i) => ({ t, ok: i === 0 })));
    card.innerHTML = barra() + '<div class="num">PREGUNTA ' + (paso + 1) + ' DE ' + ronda.length + '</div><div class="preg"></div><div class="ops"></div><div class="feedback" id="fb"></div><button class="btn" id="sig" hidden></button>';
    card.querySelector('.preg').textContent = q.p;
    const cont = card.querySelector('.ops');
    ops.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.t;
      b.addEventListener('click', () => responder(o, b, cont, q));
      cont.appendChild(b);
    });
    card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  }

  function responder(o, b, cont, q) {
    cont.querySelectorAll('button').forEach(x => { x.disabled = true; if (x.textContent === q.r[0]) x.classList.add('ok'); });
    const fb = $('fb');
    if (o.ok) {
      fb.className = 'feedback ok pop';
      fb.textContent = PIROPOS[est.piropo++ % PIROPOS.length];
      guardar();
    } else {
      b.classList.add('mal');
      fb.className = 'feedback mal pop';
      fb.textContent = 'Casi 😅 La correcta era: ' + q.r[0] + '. Igual te quiero 💗';
    }
    resultados[paso] = o.ok;
    card.querySelector('.barra').outerHTML = barra();
    const sig = $('sig');
    sig.hidden = false;
    sig.textContent = paso + 1 < ronda.length ? 'Siguiente →' : 'Ver resultado 🎓';
    sig.onclick = () => { paso++; paso < ronda.length ? pintar() : final(); };
  }

  function final() {
    const bien = resultados.filter(Boolean).length, n = ronda.length;
    est.rondas++; guardar();
    const r = bien / n;
    const [emoji, msj] =
      r === 1 ? ['🏆', '¡Perfecto! Ya te pueden dar el título, doctora. Estoy orgullosísimo de ti 💗'] :
      r >= .6 ? ['🦷', '¡Muy bien! Se nota que estudias un montón. Vas a ser increíble.'] :
      r >= .4 ? ['📚', 'Nada mal, doctora. Un repasito más y quedas perfecta 💪'] :
                ['🤗', 'Hoy no fue el día, pero eso no cambia lo inteligente que eres. ¡Otra ronda!'];
    card.innerHTML = barra() + '<div class="final"><div class="grande">' + emoji + '</div><div class="score">' + bien + ' / ' + n + '</div><p class="msj"></p><p class="firma">— ' + '</p></div><button class="btn" id="otra">Otra ronda 🦷</button>';
    card.querySelector('.msj').textContent = msj;
    card.querySelector('.firma').textContent = '— ' + FIRMA;
    $('otra').onclick = nuevaRonda;
    card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  }

  nuevaRonda();
</script>
