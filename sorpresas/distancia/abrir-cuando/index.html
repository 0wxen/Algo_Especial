<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6e7da">
<title>Abrir cuando…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script>
  // ✏️ PERSONALIZA AQUÍ ----------------------------------------------
  const NOMBRE = 'Carola';
  const FIRMA = 'Owen';
  // Cada carta: cuándo abrirla, un emoji y VARIOS mensajes.
  // Cada vez que la abre le sale el siguiente mensaje de su lista, sin repetir.
  // Puedes usar `comillas invertidas` para poder dar Enter (saltos de línea). Agrega los que quieras.
  const CARTAS = [
    { cuando: 'estés triste', emoji: '🌧️', textos: [
`Oye, está bien no estar bien.
Pero quiero que sepas que no estás sola: aquí estoy, aunque sea lejos.
Llámame si quieres, aunque sea para no decir nada.`,
`Los días grises también se acaban.
Mientras tanto, tápate con tu cobija favorita y mándame un mensaje. Aquí estoy 💗`,
`No tienes que estar bien todo el tiempo.
Llora si lo necesitas, y luego acuérdate de lo increíble que eres.`,
`Si pudiera, ahorita mismo te daría el abrazo más largo del mundo.
Guárdalo, que en diciembre te lo cobro doble 🤗`,
`Eres mucho más fuerte de lo que crees.
Y aunque hoy no lo sientas, yo sí lo veo.`,
    ]},
    { cuando: 'me extrañes', emoji: '💭', textos: [
`Yo también te extraño. Probablemente justo ahorita.
Cierra los ojos y piensa que falta menos para diciembre.`,
`Mándame un mensaje que diga "te extraño".
Te apuesto a que te contesto más rápido que un pit stop 🏎️`,
`Extrañarte es la prueba de lo bonito que es tenerte.
Ya falta menos, te lo prometo.`,
`Pon "Die For You" y piensa que, del otro lado, alguien está pensando en ti 🎤`,
`Mira la luna esta noche. Es la misma que voy a estar viendo yo 🌙`,
    ]},
    { cuando: 'no puedas dormir', emoji: '🌙', textos: [
`Pon una canción de The Weeknd bajito, respira hondo
y piensa en algo bonito… como nosotros en diciembre.
Buenas noches, bonita.`,
`Cuenta Snoopys saltando una cerca: uno, dos, tres… 🐶
Para el número diez ya vas a estar soñando.`,
`Deja el celular un ratito (después de leer esto 😅), respira lento
y piensa en el lugar más tranquilo que conozcas.`,
`Si sigues despierta, mándame un mensajito.
Me gusta ser lo último que lees antes de dormir.`,
`Mañana va a ser un buen día. Descansa, que te lo mereces.
Dulces sueños, ${NOMBRE} 💤`,
    ]},
    { cuando: 'tengas examen', emoji: '📚', textos: [
`Tú puedes. Estudiaste, eres inteligente y vas a hacerlo increíble.
Y si no sale perfecto, igual estoy orgulloso de ti. Mucha suerte, doctora 🦷`,
`Respira hondo antes de empezar y lee cada pregunta con calma.
Tú sabes más de lo que crees.`,
`Futura Dra. ${NOMBRE}: hoy es solo un paso más.
Ve, brilla y luego me cuentas todo.`,
`Un examen no define lo que vales.
Pero igual vas a sacar una calificación increíble 😉`,
`Toma agüita, desayuna algo y ve con toda la confianza.
Snoopy y yo te estamos echando porras 📣🐶`,
    ]},
    { cuando: 'estés feliz', emoji: '☀️', textos: [
`¡Me encanta! Cuéntamelo todo.
Tu felicidad es de mis cosas favoritas.`,
`¡Así me gusta verte!
Guarda este momento en tu memoria y mándame una foto de esa sonrisa 📸`,
`Qué bonito es saber que estás feliz.
Que te dure todo el día (y toda la semana).`,
`Ponle música a este momento: elige tu canción favorita y báilala 💃`,
`Tu sonrisa le gana a cualquier día soleado ☀️
Ojalá yo haya tenido algo que ver 😌`,
    ]},
    { cuando: 'estés enojada conmigo', emoji: '😤', textos: [
`Perdón. De verdad.
Respira, cómete algo rico y luego hablamos. Te quiero aunque estés enojada 😅`,
`Sé que a veces soy difícil. Gracias por tenerme paciencia.
Prometo escucharte y arreglarlo.`,
`Tienes derecho a estar enojada.
Cuando estés lista, aquí estoy para hablar (y para pedirte perdón otra vez).`,
`Vale por ganar esta discusión sin decir nada.
Úsalo ahorita si quieres 🏆`,
`Aunque estemos enojados, seguimos siendo un equipo.
Te quiero, incluso cuando frunces el ceño 😤💗`,
    ]},
    { cuando: 'necesites reírte', emoji: '😂', textos: [
`Imagina a Snoopy intentando entender la F1.
"¿Por qué dan vueltas si ya saben dónde está la meta?" 🐶🏎️`,
`¿Qué le dijo un diente a otro diente?
"¡Qué sonrisa más bonita tenemos!" 🦷 (perdón, era malísimo)`,
`Acuérdate de la última vez que nos reímos hasta que nos dolió la panza.
Ya te estás riendo, ¿verdad? 😂`,
`Snoopy intentó cantar Blinding Lights.
Los vecinos llamaron a la policía 🐶🎤🚓`,
`¿Por qué el portero no se enamora?
Porque siempre ataja los sentimientos ⚽ (ok, ya me voy)`,
    ]},
    { cuando: 'falte poco para vernos', emoji: '🎄', textos: [
`¡Ya casi! Ve pensando qué vale de Snoopy vas a canjear primero.
Nos vemos muy pronto 💗`,
`Ya puedo contar los días con los dedos.
Prepárate, que te voy a abrazar como si no hubiera mañana 🤗`,
`Haz una lista de todo lo que quieres que hagamos.
Yo ya tengo la mía (y es larguísima).`,
`Los kilómetros entre nosotros están a punto de convertirse en cero.
Qué emoción 🗺️💗`,
`Cuenta regresiva activada: nervios, emoción y muchas ganas de verte.
Nos vemos muy pronto, ${NOMBRE}.`,
    ]},
  ];
  // -------------------------------------------------------------------
</script>
<style>
  :root { --bg1: #f6e7da; --bg2: #f3d6e0; --ink: #3a2a2f; --muted: #8a7078; --red: #e8174f; --env: #fffaf3; --env2: #f2e6d6; --paper: #fffdf8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: linear-gradient(170deg, var(--bg1), var(--bg2)); background-attachment: fixed; color: var(--ink);
    font-family: "Quicksand", system-ui, sans-serif; min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
  }
  main { width: min(100%, 600px); margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) 16px max(30px, env(safe-area-inset-bottom)); }
  h1 { font-family: "Caveat", cursive; color: var(--red); font-size: clamp(2.6rem, 11vw, 3.6rem); margin: 0; text-align: center; line-height: 1; }
  .sub { text-align: center; color: var(--muted); margin: 6px 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .env {
    position: relative; aspect-ratio: 4 / 3; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit;
    background: var(--env); border-radius: 8px; box-shadow: 0 6px 16px rgba(120, 60, 60, .14);
    overflow: hidden; transition: transform .2s;
  }
  .env:active { transform: scale(.97); }
  .env::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 55%;
    background: var(--env2); clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .env .seal {
    position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
    width: 40px; height: 40px; border-radius: 50%; background: var(--red); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .env .lbl { position: absolute; left: 6px; right: 6px; bottom: 8px; text-align: center; font-family: "Caveat", cursive; font-size: 1.3rem; line-height: 1.05; }
  .env .lbl small { display: block; font-family: "Quicksand", sans-serif; font-size: .65rem; color: var(--muted); letter-spacing: .08em; font-weight: 700; }
  .env.opened .seal { background: #ffd0dc; color: var(--red); }

  .overlay { position: fixed; inset: 0; z-index: 10; background: rgba(58,42,47,.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .letter {
    position: relative; width: min(100%, 440px); max-height: 85vh; max-height: 85dvh; overflow-y: auto;
    background: repeating-linear-gradient(to bottom, transparent 0 33px, #f3d6dd 33px 34px), var(--paper);
    border-radius: 14px; padding: 30px 22px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.3);
    transform: translateY(60px) scale(.8); transition: transform .5s cubic-bezier(.2,1.4,.4,1);
  }
  .overlay.open .letter { transform: none; }
  .letter .cuando { font-family: "Caveat", cursive; font-size: 1.5rem; color: var(--red); line-height: 34px; }
  .letter .num { font-size: .72rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; line-height: 1; margin-top: -10px; }
  .letter p { font-family: "Caveat", cursive; font-size: clamp(1.4rem, 5.4vw, 1.65rem); line-height: 34px; margin: 0; white-space: pre-line; }
  .letter .firma { text-align: right; font-family: "Caveat", cursive; font-size: 1.5rem; color: var(--red); line-height: 34px; margin-top: 8px; }
  .close { position: absolute; top: 6px; right: 10px; border: 0; background: none; font-size: 1.6rem; color: var(--muted); cursor: pointer; padding: 4px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Abrir cuando…</h1>
  <p class="sub" id="sub"></p>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Carta">
  <div class="letter">
    <button class="close" id="close" aria-label="Cerrar">×</button>
    <div class="num" id="num"></div>
    <div class="cuando" id="cuando"></div>
    <p id="texto"></p>
    <div class="firma" id="firma"></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  $('sub').textContent = 'Cartas para ' + NOMBRE + '. Ábrelas solo cuando toque 😉';
  $('firma').textContent = 'Con cariño, ' + FIRMA;
  const KEY = 'abrir-cuando-abiertas';
  let abiertas = [];
  const KEY_VISTOS = 'abrir-cuando-vistos';
  let vistos = {};
  try { vistos = JSON.parse(localStorage.getItem(KEY_VISTOS)) || {}; } catch (e) {}
  try { abiertas = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}

  CARTAS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'env' + (abiertas.includes(i) ? ' opened' : '');
    b.innerHTML = '<span class="seal"></span><span class="lbl"><small>ABRIR CUANDO</small><span></span></span>';
    b.querySelector('.seal').textContent = c.emoji;
    b.querySelector('.lbl span').textContent = c.cuando;
    b.addEventListener('click', () => {
      $('cuando').textContent = 'Para cuando ' + c.cuando + ':';
      // Siguiente mensaje de esta carta (no se repiten; cuando se acaban, vuelven a empezar)
      const k = vistos[i] || 0;
      $('texto').textContent = c.textos[k % c.textos.length];
      $('num').textContent = 'Mensaje ' + ((k % c.textos.length) + 1) + ' de ' + c.textos.length;
      vistos[i] = k + 1;
      try { localStorage.setItem(KEY_VISTOS, JSON.stringify(vistos)); } catch (e) {}
      $('overlay').classList.add('open');
      if (!abiertas.includes(i)) { abiertas.push(i); b.classList.add('opened'); try { localStorage.setItem(KEY, JSON.stringify(abiertas)); } catch (e) {} }
    });
    $('grid').appendChild(b);
  });
  $('close').addEventListener('click', () => $('overlay').classList.remove('open'));
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').classList.remove('open'); });
</script>
<a class="volver-menu" href="../../index.html" style="position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:50;background:rgba(255,255,255,.88);color:#4a2b33;text-decoration:none;font:700 13px/1 system-ui,-apple-system,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18)">← Menú</a>
</body>
</html>
