<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b22">
<title>Nuestro cielo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script>
  // ✏️ PERSONALIZA AQUÍ ----------------------------------------------
  const NOMBRE = 'Carola';
  const FIRMA = 'Owen';
  const CIUDAD_TUYA = 'Durango';
  const CIUDAD_ELLA = 'Puebla';
  // Cada estrella guarda uno de estos. Puedes agregar o quitar: el cielo pone una estrella por cada uno.
  const ESTRELLAS = [
    'Esta estrella es por la primera vez que hablamos. No sabía que iba a cambiarme tanto el día.',
    'Esta es por tu risa. Si se pudiera guardar en un frasco, la escucharía todos los días.',
    'Esta brilla por lo dedicada que eres con tu carrera. Te admiro muchísimo.',
    'Esta es por todas las noches que nos quedamos hablando hasta tarde 🌙',
    'Esta es para recordarte que, aunque estemos lejos, vemos el mismo cielo.',
    'Esta es por tus ojos. Ninguna estrella brilla así.',
    'Esta es por las veces que me haces sonreír sin darte cuenta 😁',
    'Esta es por diciembre: la estoy guardando para cuando por fin te abrace 🎄',
    'Esta es por Snoopy, que nos cae bien a los dos 🐶',
    'Esta es por la música: cada canción bonita ahora me recuerda a ti 🎶',
    'Esta es por tu forma de ser: dulce, fuerte y auténtica.',
    'Esta es por la futura Dra. ' + NOMBRE + ', que va a cuidar muchas sonrisas 🦷',
    'Esta es por la paciencia que le tienes a la distancia. Vale la pena, te lo prometo.',
    'Esta es por todas las carreras de F1 que vamos a ver juntos 🏎️',
    'Esta es por los buenos días que me alegran la mañana ☀️',
    'Esta es por las cosas que aún no vivimos, pero que ya quiero vivir contigo.',
    'Esta es por ti, simplemente por existir ✨',
    'Esta es por los mensajes que releo cuando te extraño.',
    'Esta es la más pequeña, pero no la menos importante: me gustas mucho.',
    'Esta es por cada kilómetro entre ' + CIUDAD_TUYA + ' y ' + CIUDAD_ELLA + '. Ninguno es demasiado.',
    'Esta es por tu voz. Es mi sonido favorito.',
    'Esta es por los planes que tenemos pendientes. Todos los vamos a cumplir.',
    'Esta es por la forma tan bonita en que ves el mundo.',
    'Y esta última es para que pidas un deseo. Ojalá se parezca al mío 💫',
  ];
  // -------------------------------------------------------------------
</script>
<style>
  :root { --c1: #070b22; --c2: #1b1f52; --c3: #4a2f6e; --txt: #eef0ff; --muted: #a9aed6; --oro: #ffe08a; --rosa: #ff8fb1; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: linear-gradient(180deg, var(--c1), var(--c2) 65%, var(--c3)); background-attachment: fixed;
    color: var(--txt); font-family: "Quicksand", system-ui, sans-serif;
    min-height: 100vh; min-height: 100dvh; overflow-x: hidden; text-align: center;
    padding: max(52px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .fondo { position: fixed; inset: 0; pointer-events: none; }
  .fondo i { position: absolute; border-radius: 50%; background: #fff; animation: titila ease-in-out infinite alternate; }
  @keyframes titila { from { opacity: .1; } to { opacity: .9; } }
  .fugaz { position: fixed; top: 12%; left: -10%; width: 120px; height: 2px; pointer-events: none; opacity: 0;
    background: linear-gradient(90deg, transparent, #fff); transform: rotate(18deg); animation: fugaz 9s linear infinite 2s; }
  @keyframes fugaz { 0% { opacity: 0; transform: translate(0, 0) rotate(18deg); } 2% { opacity: 1; } 10% { opacity: 0; transform: translate(70vw, 23vw) rotate(18deg); } 100% { opacity: 0; } }
  .wrap { position: relative; width: min(100%, 560px); margin: 0 auto; }
  h1 { font-family: "Caveat", cursive; color: var(--oro); font-size: clamp(2.6rem, 11vw, 3.4rem); margin: 0; line-height: 1; text-shadow: 0 0 18px rgba(255, 224, 138, .4); }
  .sub { color: var(--muted); margin: 6px 0 4px; }
  .contador { font-weight: 700; color: var(--oro); font-size: .95rem; }
  .cielo { position: relative; height: min(62vh, 520px); min-height: 380px; margin-top: 6px; }
  .luna { position: absolute; left: 50%; top: 4%; width: 58px; height: 58px; margin-left: -29px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fffbe8, #f3e3a8); box-shadow: 0 0 30px rgba(255, 240, 190, .55); }
  .luna::after { content: ""; position: absolute; width: 10px; height: 10px; left: 30px; top: 16px; border-radius: 50%; background: rgba(200, 180, 120, .35); box-shadow: -14px 18px 0 -2px rgba(200, 180, 120, .3); }
  .estrella { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0; background: none; cursor: pointer; }
  .estrella svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .estrella path { fill: var(--oro); filter: drop-shadow(0 0 6px rgba(255, 224, 138, .9)); }
  .estrella:not(.vista) svg { animation: late 1.8s ease-in-out infinite alternate; }
  @keyframes late { from { transform: scale(.82); } to { transform: scale(1.08); } }
  .estrella.vista path { fill: var(--rosa); filter: drop-shadow(0 0 4px rgba(255, 143, 177, .7)); }
  .estrella.vista svg { transform: scale(.7); opacity: .85; }
  .estrella:focus-visible { outline: 2px solid var(--oro); border-radius: 50%; }
  .horizonte { position: relative; margin-top: -6px; }
  .horizonte svg { width: 100%; height: auto; display: block; }
  .horizonte text { font-family: "Caveat", cursive; font-weight: 700; font-size: 20px; fill: var(--txt); }
  .modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(5, 8, 25, .6); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 60; }
  .modal.show { opacity: 1; pointer-events: auto; }
  .nota { width: min(100%, 360px); background: #fffaf0; color: #3a2d40; border-radius: 20px; padding: 22px 20px 16px; box-shadow: 0 0 40px rgba(255, 224, 138, .35); transform: scale(.85); transition: transform .35s cubic-bezier(.2,1.5,.4,1); }
  .modal.show .nota { transform: none; }
  .nota .ico { font-size: 2.2rem; line-height: 1; }
  .nota p { font-family: "Caveat", cursive; font-size: clamp(1.5rem, 6vw, 1.8rem); line-height: 1.15; margin: 8px 0 6px; }
  .nota .firma { font-family: "Caveat", cursive; color: #e8174f; font-size: 1.4rem; margin: 0; }
  .nota button { font: inherit; font-weight: 700; margin-top: 10px; border: 0; border-radius: 999px; padding: 10px 20px; background: #3a2d6e; color: #fff; cursor: pointer; }
  .final { font-family: "Caveat", cursive; font-size: 1.5rem; color: var(--oro); margin: 10px 0 0; min-height: 1.2em; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="fondo" id="fondo" aria-hidden="true"></div>
  <div class="fugaz" aria-hidden="true"></div>
  <div class="wrap">
    <h1>Nuestro cielo</h1>
    <p class="sub">Toca las estrellas que brillan ✨</p>
    <div class="contador" id="contador"></div>
    <div class="cielo" id="cielo"><div class="luna" aria-hidden="true"></div></div>
    <div class="horizonte" aria-hidden="true">
      <svg viewBox="0 0 400 70">
        <path d="M0 70 V40 Q40 22 80 36 T160 34 Q200 46 240 32 T320 36 Q360 24 400 38 V70 Z" fill="#141436"/>
        <!-- casitas con luz -->
        <g fill="#0e0e28"><rect x="40" y="26" width="16" height="14"/><path d="M38 27 L48 18 L58 27 Z"/><rect x="62" y="30" width="12" height="10"/>
          <rect x="330" y="24" width="16" height="14"/><path d="M328 25 L338 16 L348 25 Z"/><rect x="352" y="28" width="12" height="10"/></g>
        <g fill="#ffd36b"><rect x="45" y="30" width="5" height="5"/><rect x="66" y="33" width="4" height="4"/><rect x="335" y="28" width="5" height="5"/><rect x="356" y="31" width="4" height="4"/></g>
        <text x="58" y="62" text-anchor="middle" id="cTuya"></text>
        <text x="345" y="62" text-anchor="middle" id="cElla"></text>
        <path d="M100 52 Q200 30 300 52" fill="none" stroke="#ff8fb1" stroke-width="1.5" stroke-dasharray="3 5" opacity=".8"/>
        <text x="200" y="46" text-anchor="middle" style="font-size:16px">💗</text>
      </svg>
    </div>
    <p class="final" id="final"></p>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="nota">
      <div class="ico">⭐</div>
      <p id="texto"></p>
      <p class="firma" id="firma"></p>
      <button id="cerrar">Seguir viendo el cielo</button>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  $('firma').textContent = '— ' + FIRMA;
  $('cTuya').textContent = CIUDAD_TUYA;
  $('cElla').textContent = CIUDAD_ELLA;

  // estrellitas de fondo
  const fondo = $('fondo');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('i'), t = Math.random() < .15 ? 3 : Math.random() < .5 ? 2 : 1;
    s.style.width = s.style.height = t + 'px';
    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 85 + '%';
    s.style.animationDuration = (1.2 + Math.random() * 3) + 's'; s.style.animationDelay = (Math.random() * 3) + 's';
    fondo.appendChild(s);
  }

  // Posiciones fijas (siempre las mismas) repartidas en una cuadrícula con un poco de azar
  function azar(semilla) { return () => { semilla |= 0; semilla = semilla + 0x6D2B79F5 | 0; let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = azar(1012);
  const n = ESTRELLAS.length, colsN = 4, filas = Math.ceil(n / colsN);
  const celdas = [];
  for (let f = 0; f < filas; f++) for (let c = 0; c < colsN; c++) celdas.push([c, f]);
  // revuelve las celdas para que el orden de los mensajes no se vea en el cielo
  for (let i = celdas.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [celdas[i], celdas[j]] = [celdas[j], celdas[i]]; }

  const KEY = 'cielo-vistas';
  let vistas = [];
  try { vistas = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(vistas)); } catch (e) {} };

  const cielo = $('cielo');
  const forma = '<svg viewBox="-12 -12 24 24"><path d="M0 -11 L2.6 -3.4 L10.5 -3.4 L4.1 1.3 L6.5 9 L0 4.3 L-6.5 9 L-4.1 1.3 L-10.5 -3.4 L-2.6 -3.4 Z"/></svg>';
  ESTRELLAS.forEach((txt, i) => {
    const [c, f] = celdas[i];
    let x = 12 + (c + .2 + rnd() * .6) * (76 / colsN);
    let y = 20 + (f + .2 + rnd() * .6) * (76 / filas);
    if (y < 26 && Math.abs(x - 50) < 14) x += x < 50 ? -12 : 12;   // no encima de la luna
    const b = document.createElement('button');
    b.className = 'estrella' + (vistas.includes(i) ? ' vista' : '');
    b.style.left = x + '%'; b.style.top = y + '%';
    b.innerHTML = forma;
    b.setAttribute('aria-label', 'Estrella ' + (i + 1));
    b.querySelector('svg').style.animationDelay = (rnd() * 1.8) + 's';
    b.addEventListener('click', () => abrir(i, b));
    cielo.appendChild(b);
  });

  function contador() {
    $('contador').textContent = 'Estrellas descubiertas: ' + vistas.length + ' de ' + n;
    $('final').textContent = vistas.length >= n ? 'Descubriste todo el cielo. Ahora cada estrella de verdad también es tuya, ' + NOMBRE + ' 💫' : '';
  }
  contador();

  let ultimoBoton = null;
  function abrir(i, b) {
    $('texto').textContent = ESTRELLAS[i];
    $('modal').classList.add('show');
    ultimoBoton = b;
    if (!vistas.includes(i)) { vistas.push(i); guardar(); }
    b.classList.add('vista');
    contador();
    $('cerrar').focus();
  }
  const cerrar = () => { $('modal').classList.remove('show'); ultimoBoton && ultimoBoton.focus(); };
  $('cerrar').addEventListener('click', cerrar);
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal') cerrar(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
</script>

</body>
</html>
