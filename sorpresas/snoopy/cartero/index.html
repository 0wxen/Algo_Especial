<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0d9">
<title>Snoopy cartero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script>
  // ✏️ PERSONALIZA AQUÍ ----------------------------------------------
  const NOMBRE = 'Carola';
  const FIRMA = 'Owen';
  // Llega una carta nueva 24 horas después de abrir la anterior, en este orden. Cuando se acaban, vuelven a empezar.
  const CARTAS = [
    'Hoy me acordé de ti sin razón, bueno, sí había razón: siempre me acuerdo de ti.',
    'Gracias por las risas de ayer. Y de antier. Y de todos los días.',
    'Si hoy estás cansada, descansa. Si estás feliz, cuéntame. Si estás triste, llámame.',
    'Snoopy no sabe escribir, así que me pidió que te dijera que eres muy bonita.',
    'Ya falta menos para diciembre. Cada día cuenta.',
    'Eres de esas personas que hacen que todo valga la pena.',
  ];
  // -------------------------------------------------------------------
</script>
<style>
  :root { --bg1: #fff0d9; --bg2: #ffd9e2; --ink: #3a2a1d; --muted: #8a6f55; --red: #e8174f; --paper: #fffdf7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: linear-gradient(170deg, var(--bg1), var(--bg2)); color: var(--ink);
    font-family: "Quicksand", system-ui, sans-serif; min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); text-align: center;
  }
  h1 { font-family: "Caveat", cursive; color: var(--red); font-size: clamp(2.2rem, 9vw, 3rem); margin: 0; line-height: 1; }
  .sub { color: var(--muted); margin: 4px 0 10px; }

  .stage { width: min(80vw, 300px); position: relative; cursor: pointer; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  #walker { animation: llegar 1.6s cubic-bezier(.3,1.2,.5,1) both; }
  @keyframes llegar { from { transform: translateX(-120vw); } }
  #bob { animation: bob .3s ease-in-out 5 alternate; }
  @keyframes bob { to { transform: translateY(-5px); } }
  #sobre { cursor: pointer; transform-origin: 196px 104px; animation: menear 1.2s ease-in-out 1.8s infinite; }
  @keyframes menear { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  .hint { color: var(--muted); margin-top: 6px; }

  .carta {
    width: min(100%, 420px); margin-top: 8px;
    background: repeating-linear-gradient(to bottom, transparent 0 31px, #f0d9c4 31px 32px), var(--paper);
    border-radius: 12px; padding: 22px 20px 18px; text-align: left;
    box-shadow: 0 16px 40px rgba(120, 60, 20, .2);
    opacity: 0; transform: translateY(30px) rotate(-3deg); transition: opacity .5s, transform .6s cubic-bezier(.2,1.4,.4,1);
    pointer-events: none;
  }
  .carta.show { opacity: 1; transform: none; pointer-events: auto; }
  .carta .para { font-family: "Caveat", cursive; font-size: 1.5rem; color: var(--muted); }
  .carta p { font-family: "Caveat", cursive; font-size: clamp(1.45rem, 5.5vw, 1.7rem); line-height: 32px; margin: 4px 0; }
  .carta .firma { text-align: right; font-family: "Caveat", cursive; font-size: 1.5rem; color: var(--red); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <h1>¡Correo para ti!</h1>
  <p class="sub" id="sub"></p>

  <div class="stage">
    <svg viewBox="40 20 190 180" aria-hidden="true">
      <g id="walker"><g id="bob">
        <ellipse cx="108" cy="190" rx="58" ry="5" fill="#000" opacity=".15"/>
        <path d="M76 158 C62 156 56 144 62 134" fill="none" stroke="#1d1d1f" stroke-width="9" stroke-linecap="round"/>
        <path d="M76 158 C62 156 56 144 62 134" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <!-- bolsa de cartero -->
        <path d="M84 104 L128 160" stroke="#8a5a2b" stroke-width="5"/>
        <path d="M86 100 C70 122 64 152 72 178 L140 178 C146 150 138 120 122 98 Z" fill="#fff" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"/>
        <rect x="64" y="140" width="40" height="30" rx="5" fill="#b77b3f" stroke="#1d1d1f" stroke-width="2.5"/>
        <path d="M64 148 H104" stroke="#1d1d1f" stroke-width="2"/>
        <ellipse cx="86" cy="181" rx="20" ry="8" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
        <ellipse cx="131" cy="182" rx="23" ry="8.5" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
        <path d="M70 70 C66 40 92 26 118 32 C140 37 160 40 178 44 C196 48 198 72 180 76 C160 80 140 82 126 90 C116 104 90 108 78 98 C70 92 70 82 70 70 Z" fill="#fff" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"/>
        <!-- gorra de cartero -->
        <path d="M84 40 C90 18 130 16 140 34 Z" fill="#2c4a8a" stroke="#1d1d1f" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M132 32 Q150 30 158 38" fill="none" stroke="#1d1d1f" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="185" cy="51" rx="10" ry="8" fill="#1d1d1f" transform="rotate(-12 185 51)"/>
        <ellipse cx="132" cy="52" rx="2.8" ry="5.5" fill="#1d1d1f"/>
        <ellipse cx="142" cy="66" rx="8" ry="4.5" fill="#ff9db5" opacity=".75"/>
        <path d="M152 71 Q166 78 181 70" fill="none" stroke="#1d1d1f" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M98 40 C78 34 62 50 62 76 C62 100 68 116 82 116 C96 116 100 100 98 84 C96 66 106 50 98 40 Z" fill="#1d1d1f"/>
        <path d="M110 126 C126 122 144 118 166 114" fill="none" stroke="#1d1d1f" stroke-width="13" stroke-linecap="round"/>
        <path d="M110 126 C126 122 144 118 166 114" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <g id="sobre">
          <rect x="170" y="88" width="52" height="34" rx="4" fill="#fffaf3" stroke="#c9003a" stroke-width="2.5"/>
          <path d="M170 90 L196 110 L222 90" fill="none" stroke="#c9003a" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M196 112 c-3-4 -9-2 -7 3 c1 3 7 6 7 6 c0 0 6-3 7-6 c2-5 -4-7 -7-3 z" fill="#e8174f"/>
        </g>
        <circle cx="168" cy="114" r="7" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
      </g></g>
    </svg>
  </div>
  <p class="hint" id="hint">Toca la carta 💌</p>

  <div class="carta" id="carta">
    <div class="para" id="para"></div>
    <p id="texto"></p>
    <div class="firma" id="firma"></div>
  </div>
  <p class="hint" id="next"></p>

<script>
  const $ = id => document.getElementById(id);
  $('sub').textContent = 'Snoopy trae una carta para ' + NOMBRE + ' cada 24 horas';
  $('para').textContent = 'Para ' + NOMBRE + ':';
  $('firma').textContent = '— ' + FIRMA;

  // Un mensaje nuevo cada 24 horas, contadas desde que abre el anterior
  const ESPERA = 24 * 60 * 60 * 1000;
  const KEY = 'cartero-estado';
  function leer() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
  function guardar(e) { try { localStorage.setItem(KEY, JSON.stringify(e)); } catch (e2) {} }
  let estado = leer();   // { i: número de mensaje, t: cuándo lo abrió }
  const listoNuevo = () => !estado || Date.now() - estado.t >= ESPERA;
  function abrirMensaje() {
    if (listoNuevo()) {
      estado = { i: estado ? (estado.i + 1) % CARTAS.length : 0, t: Date.now() };
      guardar(estado);
    }
    return CARTAS[estado.i % CARTAS.length];
  }
  function faltaTexto() {
    const falta = Math.max(0, estado.t + ESPERA - Date.now());
    const h = Math.floor(falta / 3600000), m = Math.floor(falta / 60000) % 60, s = Math.floor(falta / 1000) % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  let abierta = false;
  function abrir() {
    if (abierta && !listoNuevo()) return;
    const c = $('carta');
    c.classList.remove('show');
    setTimeout(() => {
      $('texto').textContent = abrirMensaje();
      c.classList.add('show');
      abierta = true;
      $('hint').textContent = '';
      tick();
    }, abierta ? 300 : 0);
  }
  function tick() {
    if (!abierta) { $('next').textContent = ''; return; }
    if (listoNuevo()) { $('hint').textContent = '¡Llegó una carta nueva! Toca a Snoopy 💌'; $('next').textContent = ''; return; }
    $('next').textContent = 'La próxima carta llega en ' + faltaTexto() + ' 📬';
  }

  // Si ya abrió una y no han pasado 24 horas, se la vuelve a mostrar
  if (estado && !listoNuevo()) setTimeout(abrir, 1700);
  setInterval(tick, 1000);
  document.querySelector('.stage').addEventListener('click', abrir);
</script>
<a class="volver-menu" href="../../index.html" style="position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:50;background:rgba(255,255,255,.88);color:#4a2b33;text-decoration:none;font:700 13px/1 system-ui,-apple-system,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18)">← Menú</a>
</body>
</html>
