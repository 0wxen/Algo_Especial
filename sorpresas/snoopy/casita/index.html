<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe3ff">
<title>La casita de Snoopy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script>
  // ✏️ PERSONALIZA AQUÍ ----------------------------------------------
  const NOMBRE = 'Carola';
  const FIRMA = 'Owen';
  // Sale un mensaje nuevo 24 horas después de abrir el anterior, en este orden. Cuando se acaban, vuelven a empezar.
  const MENSAJES = [
    '¡Hola, ' + NOMBRE + '! ' + FIRMA + ' me mandó a decirte que te extraña 💗',
    'Snoopy aprueba tu sonrisa ✅🐶',
    'Hoy es un buen día para que te vaya increíble ✨',
    '¿Ya tomaste agüita? Snoopy pregunta 💧',
    'Te mando un abrazo de perrito 🤗',
    'Faltan menos días para diciembre 🎄',
    'Eres la humana favorita de Snoopy (y de Owen) 🐾',
  ];
  // -------------------------------------------------------------------
</script>
<style>
  :root { --sky1: #bfe3ff; --sky2: #fff1f5; --grass: #7cc576; --ink: #2b2a33; --red: #d7263d; --muted: #6e6a7c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: linear-gradient(180deg, var(--sky1), var(--sky2));
    color: var(--ink); font-family: "Quicksand", system-ui, sans-serif;
    min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  h1 { font-family: "Caveat", cursive; color: var(--red); font-size: clamp(2.2rem, 9vw, 3rem); margin: 0; line-height: 1; }
  .sub { color: var(--muted); margin: 4px 0 6px; }
  .bubble {
    position: relative; width: min(100%, 360px); min-height: 70px;
    background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 12px 16px;
    font-family: "Caveat", cursive; font-size: clamp(1.4rem, 5.5vw, 1.7rem); line-height: 1.2;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.85); transition: opacity .3s, transform .35s cubic-bezier(.2,1.5,.4,1);
    margin-top: 10px;
  }
  .bubble.show { opacity: 1; transform: none; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -20px; margin-left: -10px; border: 10px solid transparent; border-top-color: var(--ink); }
  .stage { width: min(92vw, 380px); cursor: pointer; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  #dog { transform: translateY(260px); transition: transform .7s cubic-bezier(.3,1.4,.5,1); }
  .out #dog { transform: translateY(0); }
  .out #dance { animation: baile .5s ease-in-out .7s 4 alternate; transform-origin: 150px 50px; }
  @keyframes baile { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  #house { transition: transform .2s; transform-origin: 150px 240px; }
  .stage:active #house { transform: scale(.98); }
  .hint { color: var(--muted); margin-top: 4px; }
  .firma { font-family: "Caveat", cursive; color: var(--red); font-size: 1.5rem; margin-top: 4px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <h1>La casita de Snoopy</h1>
  <p class="sub" id="sub"></p>
  <div class="bubble" id="bubble"></div>

  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Tocar la casita">
    <svg viewBox="0 -120 300 380" aria-hidden="true">
      <defs>
        <clipPath id="ground"><rect x="-50" y="-200" width="400" height="440"/></clipPath>
        <symbol id="snoopy" viewBox="50 20 160 175">
          <path d="M76 158 C62 156 56 144 62 134" fill="none" stroke="#1d1d1f" stroke-width="9" stroke-linecap="round"/>
          <path d="M76 158 C62 156 56 144 62 134" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M86 100 C70 122 64 152 72 178 L140 178 C146 150 138 120 122 98 Z" fill="#fff" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"/>
          <path d="M118 176 C120 160 128 150 138 148" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse cx="86" cy="181" rx="20" ry="8" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
          <ellipse cx="131" cy="182" rx="23" ry="8.5" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
          <path d="M84 102 Q103 113 124 100" fill="none" stroke="#e8174f" stroke-width="6" stroke-linecap="round"/>
          <path d="M70 70 C66 40 92 26 118 32 C140 37 160 40 178 44 C196 48 198 72 180 76 C160 80 140 82 126 90 C116 104 90 108 78 98 C70 92 70 82 70 70 Z" fill="#fff" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="185" cy="51" rx="10" ry="8" fill="#1d1d1f" transform="rotate(-12 185 51)"/>
          <path d="M127 51 Q132 46 137 51" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="142" cy="66" rx="8" ry="4.5" fill="#ff9db5" opacity=".75"/>
          <path d="M150 70 Q166 82 182 70" fill="none" stroke="#1d1d1f" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M98 36 C78 30 62 50 62 76 C62 100 68 116 82 116 C96 116 100 100 98 84 C96 66 108 46 98 36 Z" fill="#1d1d1f"/>
          <path d="M110 126 C122 116 134 108 146 100" fill="none" stroke="#1d1d1f" stroke-width="13" stroke-linecap="round"/>
          <path d="M110 126 C122 116 134 108 146 100" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
          <circle cx="146" cy="100" r="7" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
        </symbol>
      </defs>
      <!-- pasto -->
      <ellipse cx="150" cy="246" rx="170" ry="22" fill="var(--grass)"/>
      <!-- Snoopy (sale de atrás de la casa) -->
      <g clip-path="url(#ground)">
        <g id="dog"><g id="dance">
          <use href="#snoopy" x="96" y="-109" width="150" height="164"/>
        </g></g>
      </g>
      <!-- casita -->
      <g id="house">
        <rect x="62" y="110" width="176" height="130" fill="var(--red)" stroke="#1d1d1f" stroke-width="4"/>
        <path d="M70 140 H230 M70 170 H230 M70 200 H230" stroke="#a81a2d" stroke-width="2" opacity=".6"/>
        <path d="M118 240 V178 A32 32 0 0 1 182 178 V240 Z" fill="#1d1d1f"/>
        <path d="M48 124 L150 46 L252 124" fill="none" stroke="#1d1d1f" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M48 124 L150 46 L252 124" fill="none" stroke="#3b3b45" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M66 118 L150 54 L234 118 Z" fill="var(--red)"/>
        <rect x="128" y="88" width="44" height="16" rx="3" fill="#fff" stroke="#1d1d1f" stroke-width="2"/>
        <text x="150" y="100" text-anchor="middle" font-family="Quicksand, sans-serif" font-weight="700" font-size="10" fill="#1d1d1f">SNOOPY</text>
      </g>
    </svg>
  </div>
  <p class="hint" id="hint">Toca la casita 🏠</p>
  <p class="firma" id="firma"></p>

<script>
  const $ = id => document.getElementById(id);
  $('sub').textContent = 'Para ' + NOMBRE + ' · un mensaje nuevo cada 24 horas';
  $('firma').textContent = '— ' + FIRMA;
  const stage = $('stage'), bubble = $('bubble'), hint = $('hint');

  // Un mensaje nuevo cada 24 horas, contadas desde que abre el anterior
  const ESPERA = 24 * 60 * 60 * 1000;
  const KEY = 'casita-estado';
  function leer() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
  function guardar(e) { try { localStorage.setItem(KEY, JSON.stringify(e)); } catch (e2) {} }
  let estado = leer();   // { i: número de mensaje, t: cuándo lo abrió }
  const listoNuevo = () => !estado || Date.now() - estado.t >= ESPERA;
  function abrirMensaje() {
    if (listoNuevo()) {
      estado = { i: estado ? (estado.i + 1) % MENSAJES.length : 0, t: Date.now() };
      guardar(estado);
    }
    return MENSAJES[estado.i % MENSAJES.length];
  }
  function faltaTexto() {
    const falta = Math.max(0, estado.t + ESPERA - Date.now());
    const h = Math.floor(falta / 3600000), m = Math.floor(falta / 60000) % 60, s = Math.floor(falta / 1000) % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  let ocupado = false;
  function salir(animar) {
    bubble.textContent = abrirMensaje();
    stage.classList.add('out');
    setTimeout(() => { bubble.classList.add('show'); ocupado = false; }, animar ? 600 : 0);
    tick();
  }
  function tocar() {
    if (ocupado) return;
    if (stage.classList.contains('out')) {
      if (listoNuevo()) {
        // Ya pasaron 24 horas: Snoopy entra y sale con el siguiente mensaje
        ocupado = true;
        bubble.classList.remove('show');
        stage.classList.remove('out');
        setTimeout(() => salir(true), 650);
      } else {
        // Todavía no: solo baila otra vez, el mensaje es el mismo
        const d = $('dance');
        d.style.animation = 'none'; void d.getBoundingClientRect(); d.style.animation = '';
      }
      return;
    }
    ocupado = true;
    salir(true);
  }
  function tick() {
    if (!stage.classList.contains('out')) { hint.textContent = 'Toca la casita 🏠'; return; }
    hint.textContent = listoNuevo() ? '¡Hay un mensaje nuevo! Toca la casita 🏠' : 'Nuevo mensaje en ' + faltaTexto() + ' 🐶';
  }

  // Si ya tenía un mensaje abierto y no han pasado 24 horas, Snoopy ya está afuera con ese mensaje
  if (estado && !listoNuevo()) salir(false);
  tick();
  setInterval(tick, 1000);
  stage.addEventListener('click', tocar);
  stage.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocar(); } });
</script>
<a class="volver-menu" href="../../index.html" style="position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:50;background:rgba(255,255,255,.88);color:#4a2b33;text-decoration:none;font:700 13px/1 system-ui,-apple-system,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18)">← Menú</a>
</body>
</html>
