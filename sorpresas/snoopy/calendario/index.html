<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde2e4">
<title>Calendario de Snoopy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script>
  // ✏️ PERSONALIZA AQUÍ ----------------------------------------------
  const NOMBRE = 'Carola';
  const FIRMA = 'Owen';
  const FECHA_INICIO = '2026-10-20';   // primer día del calendario
  const FECHA_FIN = '2026-12-31';      // último día del calendario
  // Un mensaje por día. Si hay menos mensajes que días, se repiten en orden.
  const MENSAJES = [
    'Buenos días, bonita. Que tengas un día increíble ☀️',
    'Hoy Snoopy te manda un abrazo de oso 🐶🤗',
    'Me gusta mucho cómo eres, que no se te olvide.',
    'Échale ganas en la escuela, futura doctora 🦷',
    'Hoy pon tu canción favorita de The Weeknd y piensa en mí 🎤',
    'Un día menos para vernos 💗',
    'Gracias por las llamadas de anoche (y de todas las noches).',
    'Toma agüita y descansa, que te lo mereces 💧',
    'Si hoy fue un mal día, mañana será mejor. Aquí estoy.',
    'Snoopy dice que eres su humana favorita 🐶',
    'Me haces muy feliz, aunque estemos lejos.',
    'Pequeño recordatorio: eres increíble ✨',
    'Hoy te toca consentirte un poquito 🍫',
    'Ya falta menos… ya casi, ya casi 🎄',
  ];
  // Días especiales: en esa fecha sale este mensaje en lugar del normal (y la casilla se ve roja)
  const ESPECIALES = {
    '2026-12-19': '¡HOY NOS VEMOS! Snoopy y yo no podemos con la emoción 💗🐶',   // ← pon el día que se ven
    '2026-12-24': '¡Feliz Nochebuena! Snoopy te manda un abrazo navideño 🎄🐶',
    '2026-12-25': '¡Feliz Navidad, ' + NOMBRE + '! Gracias por ser mi mejor regalo de este año 🎁',
    '2026-12-31': 'Último día del año… y qué bonito año fue gracias a ti. ¡Feliz año nuevo! 🎆💗',
  };
  // -------------------------------------------------------------------
</script>
<style>
  :root {
    --bg1: #fde2e4;
    --bg2: #e2ecff;
    --ink: #33293d;
    --muted: #7d7189;
    --red: #e8174f;
    --tile: #ffffff;
    --locked: rgba(255,255,255,.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: linear-gradient(170deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Quicksand", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  main {
    width: min(100%, 560px); margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: center; gap: 10px; }
  .snoopy { width: 92px; flex-shrink: 0; }
  h1 { font-family: "Caveat", cursive; color: var(--red); font-size: clamp(2rem, 8.5vw, 2.7rem); margin: 0; line-height: 1; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: .95rem; }

  .month { font-family: "Caveat", cursive; font-size: 1.8rem; margin: 18px 0 6px; color: var(--ink); text-transform: capitalize; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow { text-align: center; font-size: .7rem; font-weight: 700; color: var(--muted); }
  .day {
    aspect-ratio: 1; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--tile); color: var(--ink);
    font: 700 clamp(.85rem, 3.6vw, 1.05rem) "Quicksand", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    box-shadow: 0 3px 10px rgba(51,41,61,.08);
    position: relative;
  }
  .day small { font-size: .7em; line-height: 1; }
  .day.locked { background: var(--locked); color: var(--muted); box-shadow: none; }
  .day.today { outline: 3px solid var(--red); outline-offset: -3px; animation: latido 1.4s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(1.06); } }
  .day.opened { background: #ffe0e8; }
  .day.last { background: var(--red); color: #fff; }
  .day.last.locked { background: rgba(232,23,79,.35); color: #fff; }
  .day.shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem;
    opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .overlay {
    position: fixed; inset: 0; z-index: 10; background: rgba(51,41,61,.45);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .note {
    position: relative; width: min(100%, 400px); background: #fffaf3; border-radius: 18px;
    padding: 22px 20px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25);
    transform: scale(.8) rotate(3deg); transition: transform .45s cubic-bezier(.2,1.4,.4,1);
  }
  .overlay.open .note { transform: none; }
  .note .fecha { color: var(--muted); font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
  .note p { font-family: "Caveat", cursive; font-size: clamp(1.6rem, 6.5vw, 1.9rem); line-height: 1.2; margin: 10px 0; }
  .note .firma { color: var(--red); font-family: "Caveat", cursive; font-size: 1.4rem; }
  .note .snoopy { width: 110px; margin: 0 auto; display: block; }
  .close { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 1.6rem; color: var(--muted); cursor: pointer; padding: 6px; line-height: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="snoopy" viewBox="50 20 160 175">
    <ellipse cx="108" cy="190" rx="58" ry="5" fill="#000" opacity=".15"/>
    <path d="M76 158 C62 156 56 144 62 134" fill="none" stroke="#1d1d1f" stroke-width="9" stroke-linecap="round"/>
    <path d="M76 158 C62 156 56 144 62 134" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M86 100 C70 122 64 152 72 178 L140 178 C146 150 138 120 122 98 Z" fill="#fff" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M118 176 C120 160 128 150 138 148" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="86" cy="181" rx="20" ry="8" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
    <ellipse cx="131" cy="182" rx="23" ry="8.5" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
    <path d="M84 102 Q103 113 124 100" fill="none" stroke="#e8174f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="104" cy="110" r="3.5" fill="#ffc83d" stroke="#1d1d1f" stroke-width="1.5"/>
    <path d="M70 70 C66 40 92 26 118 32 C140 37 160 40 178 44 C196 48 198 72 180 76 C160 80 140 82 126 90 C116 104 90 108 78 98 C70 92 70 82 70 70 Z" fill="#fff" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="185" cy="51" rx="10" ry="8" fill="#1d1d1f" transform="rotate(-12 185 51)"/>
    <path d="M124 39 Q131 34 139 37" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="132" cy="50" rx="2.8" ry="5.5" fill="#1d1d1f"/>
    <ellipse cx="142" cy="66" rx="8" ry="4.5" fill="#ff9db5" opacity=".75"/>
    <path d="M152 71 Q166 78 181 70" fill="none" stroke="#1d1d1f" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M98 36 C78 30 62 50 62 76 C62 100 68 116 82 116 C96 116 100 100 98 84 C96 66 108 46 98 36 Z" fill="#1d1d1f"/>
    <path d="M110 126 C118 136 122 144 126 150" fill="none" stroke="#1d1d1f" stroke-width="13" stroke-linecap="round"/>
    <path d="M110 126 C118 136 122 144 126 150" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="126" cy="150" r="7" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
  </symbol>
</svg>

<main>
  <header>
    <svg class="snoopy" viewBox="50 20 160 175" aria-hidden="true"><use href="#snoopy" x="50" y="20" width="160" height="175"/></svg>
    <div>
      <h1>Un mensajito diario</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>
  <div id="cal"></div>
</main>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Mensaje del día">
  <div class="note">
    <button class="close" id="close" aria-label="Cerrar">×</button>
    <svg class="snoopy" viewBox="50 20 160 175" aria-hidden="true"><use href="#snoopy" x="50" y="20" width="160" height="175"/></svg>
    <div class="fecha" id="noteFecha"></div>
    <p id="noteText"></p>
    <div class="firma" id="noteFirma"></div>
  </div>
</div>

<script>
  document.getElementById('sub').textContent = 'Para ' + NOMBRE + ': abre uno cada día hasta que nos veamos 🐶';
  document.getElementById('noteFirma').textContent = '— ' + FIRMA;

  const DIA = 86400000;
  const diaN = i => new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i);
  const ini = new Date(FECHA_INICIO + 'T00:00:00');
  const fin = new Date(FECHA_FIN + 'T00:00:00');
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const total = Math.round((fin - ini) / DIA) + 1;

  const KEY = 'calendario-snoopy-abiertos';
  let abiertos = [];
  try { abiertos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(abiertos)); } catch (e) {} };

  const clave = f => f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
  const especial = i => ESPECIALES[clave(diaN(i))];
  const mensajeDe = i => especial(i) || MENSAJES[i % MENSAJES.length];

  const cal = document.getElementById('cal');
  const dows = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  let grid = null, mesActual = -1;

  for (let i = 0; i < total; i++) {
    const f = diaN(i);
    if (f.getMonth() !== mesActual) {
      mesActual = f.getMonth();
      const t = document.createElement('div');
      t.className = 'month';
      t.textContent = f.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
      cal.appendChild(t);
      grid = document.createElement('div');
      grid.className = 'grid';
      dows.forEach(d => { const e = document.createElement('div'); e.className = 'dow'; e.textContent = d; grid.appendChild(e); });
      const offset = (f.getDay() + 6) % 7;
      for (let k = 0; k < offset; k++) grid.appendChild(document.createElement('div'));
      cal.appendChild(grid);
    }
    const b = document.createElement('button');
    b.className = 'day';
    const bloqueado = f > hoy;
    if (bloqueado) b.classList.add('locked');
    if (f.getTime() === hoy.getTime()) b.classList.add('today');
    if (especial(i)) b.classList.add('last');
    if (abiertos.includes(i)) b.classList.add('opened');
    b.innerHTML = '<span></span><small></small>';
    b.querySelector('span').textContent = f.getDate();
    b.querySelector('small').textContent = bloqueado ? '🔒' : (especial(i) ? '💗' : (abiertos.includes(i) ? '💌' : '✉️'));
    b.addEventListener('click', () => {
      if (bloqueado) {
        const faltan = Math.round((f - hoy) / DIA);
        aviso(faltan === 1 ? '¡Todavía no! Ábrelo mañana 🐶' : '¡Todavía no! Faltan ' + faltan + ' días 🐶');
        b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        return;
      }
      if (!abiertos.includes(i)) { abiertos.push(i); guardar(); b.classList.add('opened'); if (!especial(i)) b.querySelector('small').textContent = '💌'; }
      abrir(f, i);
    });
    grid.appendChild(b);
  }

  const toast = document.getElementById('toast');
  let tId;
  function aviso(t) {
    toast.textContent = t; toast.classList.add('show');
    clearTimeout(tId); tId = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  const overlay = document.getElementById('overlay');
  function abrir(f, i) {
    document.getElementById('noteFecha').textContent = f.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('noteText').textContent = mensajeDe(i);
    overlay.classList.add('open');
  }
  document.getElementById('close').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
</script>
