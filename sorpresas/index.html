<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe4ec">
<title>Para Carola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script>
  // ✏️ PERSONALIZA AQUÍ ----------------------------------------------
  const NOMBRE = 'Carola';
  const FIRMA = 'Owen';
  const BIENVENIDA = 'Aquí está todo lo que hice para ti. Entra cuando quieras, las veces que quieras 💗';
  // Para agregar una página nueva: copia una línea y cambia la carpeta, el emoji, el título y la descripción.
  const SECCIONES = [
    { titulo: 'Snoopy', emoji: '🐶', paginas: [
      { carpeta: 'snoopy/casita',      emoji: '🏠', titulo: 'La casita de Snoopy',  desc: 'Un mensaje nuevo cada 24 horas' },
      { carpeta: 'snoopy/cartero',     emoji: '📬', titulo: 'Snoopy cartero',       desc: 'Una carta nueva cada 24 horas' },
      { carpeta: 'snoopy/calendario',  emoji: '📅', titulo: 'Calendario',           desc: 'Un mensajito para cada día' },
      { carpeta: 'snoopy/vales',       emoji: '🎟️', titulo: 'Vales canjeables',     desc: 'Para cuando nos veamos' },
    ]},
    { titulo: 'Música', emoji: '🎤', paginas: [
      { carpeta: 'musica/concierto',   emoji: '🎤', titulo: 'Concierto privado',    desc: 'Un setlist solo para ti' },
      { carpeta: 'musica/adivina',     emoji: '🎶', titulo: 'Adivina la canción',   desc: 'Versión The Weeknd' },
    ]},
    { titulo: 'Odontología', emoji: '🦷', paginas: [
      { carpeta: 'odontologia/caries',      emoji: '🪥', titulo: 'Dientito feliz',        desc: 'Un paciente necesita a su doctora' },
      { carpeta: 'odontologia/odontograma', emoji: '🦷', titulo: 'Odontograma del amor',  desc: 'Cada diente guarda algo' },
      { carpeta: 'odontologia/credencial',  emoji: '🪪', titulo: 'Tu credencial',         desc: 'Personal autorizado' },
    ]},
    { titulo: 'Fórmula 1', emoji: '🏎️', paginas: [
      { carpeta: 'f1/parrilla',  emoji: '🏁', titulo: 'Clasificación',     desc: 'Razones por las que me encantas' },
      { carpeta: 'f1/radio',     emoji: '📻', titulo: 'Radio del equipo',  desc: 'Mensajes desde el muro de boxes' },
      { carpeta: 'f1/pit-stop',  emoji: '🛞', titulo: 'Pit stop',          desc: '¿Qué tan rápida eres?' },
    ]},
    { titulo: 'Fútbol', emoji: '⚽', paginas: [
      { carpeta: 'futbol/tarjeta',   emoji: '⭐', titulo: 'Tarjeta de jugadora', desc: 'Media 99' },
      { carpeta: 'futbol/penales',   emoji: '🥅', titulo: 'Tanda de penales',    desc: 'Un mensaje por gol' },
      { carpeta: 'futbol/marcador',  emoji: '📺', titulo: 'Nosotros vs. Distancia', desc: 'Marcador en vivo' },
    ]},
    { titulo: 'Para la distancia', emoji: '💌', paginas: [
      { carpeta: 'distancia/abrir-cuando', emoji: '✉️', titulo: 'Abrir cuando…',     desc: 'Cartas para cada momento' },
      { carpeta: 'distancia/tarro',        emoji: '🫙', titulo: 'Tarro de razones',  desc: 'Saca un papelito' },
    ]},
  ];
  // -------------------------------------------------------------------
</script>
<style>
  :root {
    --bg1: #ffe4ec; --bg2: #ffd1dc; --ink: #4a2b33; --muted: #8a6470; --red: #e8174f; --card: rgba(255,255,255,.82);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(circle at 50% 0, var(--bg1), var(--bg2)); background-attachment: fixed;
    color: var(--ink); font-family: "Quicksand", system-ui, sans-serif;
    min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
  }
  .floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .floaters span { position: absolute; bottom: -40px; color: #ff5c8a; opacity: .45; animation: subir linear infinite; }
  @keyframes subir { 10% { opacity: .5; } 100% { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }
  main { position: relative; width: min(100%, 640px); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px max(36px, env(safe-area-inset-bottom)); }

  header { text-align: center; }
  .snoopy { width: 120px; display: block; margin: 0 auto -6px; animation: brinco 1.4s ease-in-out infinite alternate; }
  @keyframes brinco { to { transform: translateY(-6px); } }
  h1 { font-family: "Caveat", cursive; color: var(--red); font-size: clamp(2.8rem, 12vw, 3.8rem); margin: 0; line-height: 1; }
  .bienvenida { color: var(--muted); margin: 8px auto 18px; max-width: 420px; line-height: 1.5; }

  .carta {
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: #fff;
    background: linear-gradient(135deg, #ff5c8a, var(--red)); border-radius: 18px; padding: 16px 18px;
    box-shadow: 0 10px 26px rgba(232,23,79,.3);
  }
  .carta .e { font-size: 2.2rem; }
  .carta b { display: block; font-size: 1.1rem; }
  .carta span { opacity: .9; font-size: .9rem; }

  h2 { display: flex; align-items: center; gap: 8px; font-family: "Caveat", cursive; font-size: 1.9rem; margin: 26px 0 10px; color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
  .item {
    display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: inherit;
    background: var(--card); border-radius: 16px; padding: 14px; box-shadow: 0 4px 14px rgba(150, 40, 80, .1);
    transition: transform .15s;
  }
  .item:active { transform: scale(.97); }
  .item:hover { outline: 2px solid var(--red); }
  .item .e { font-size: 1.8rem; }
  .item b { font-size: 1rem; }
  .item span { color: var(--muted); font-size: .82rem; line-height: 1.3; }
  footer { text-align: center; margin-top: 32px; font-family: "Caveat", cursive; font-size: 1.6rem; color: var(--red); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="floaters" id="floaters" aria-hidden="true"></div>
<main>
  <header>
    <svg class="snoopy" viewBox="50 20 160 175" aria-hidden="true">
      <ellipse cx="108" cy="190" rx="58" ry="5" fill="#000" opacity=".12"/>
      <path d="M76 158 C62 156 56 144 62 134" fill="none" stroke="#1d1d1f" stroke-width="9" stroke-linecap="round"/>
      <path d="M76 158 C62 156 56 144 62 134" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M86 100 C70 122 64 152 72 178 L140 178 C146 150 138 120 122 98 Z" fill="#fff" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"/>
      <path d="M118 176 C120 160 128 150 138 148" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="86" cy="181" rx="20" ry="8" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
      <ellipse cx="131" cy="182" rx="23" ry="8.5" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
      <path d="M84 102 Q103 113 124 100" fill="none" stroke="#e8174f" stroke-width="6" stroke-linecap="round"/>
      <circle cx="104" cy="110" r="3.5" fill="#ffc83d" stroke="#1d1d1f" stroke-width="1.5"/>
      <path d="M70 70 C66 40 92 26 118 32 C140 37 160 40 178 44 C196 48 198 72 180 76 C160 80 140 82 126 90 C116 104 90 108 78 98 C70 92 70 82 70 70 Z" fill="#fff" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="185" cy="51" rx="10" ry="8" fill="#1d1d1f" transform="rotate(-12 185 51)"/>
      <path d="M127 51 Q132 46 137 51" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="142" cy="66" rx="8" ry="4.5" fill="#ff9db5" opacity=".75"/>
      <path d="M150 70 Q166 82 182 70" fill="none" stroke="#1d1d1f" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M98 36 C78 30 62 50 62 76 C62 100 68 116 82 116 C96 116 100 100 98 84 C96 66 108 46 98 36 Z" fill="#1d1d1f"/>
      <path d="M110 126 C122 116 134 108 146 100" fill="none" stroke="#1d1d1f" stroke-width="13" stroke-linecap="round"/>
      <path d="M110 126 C122 116 134 108 146 100" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="146" cy="100" r="7" fill="#fff" stroke="#1d1d1f" stroke-width="3"/>
    </svg>
    <h1 id="titulo"></h1>
    <p class="bienvenida" id="bienvenida"></p>
  </header>

  <a class="carta" href="../index.html">
    <span class="e">💌</span>
    <span><b>La primera carta</b><span>Donde empezó todo</span></span>
  </a>

  <div id="secciones"></div>
  <footer id="firma"></footer>
</main>

<script>
  const $ = id => document.getElementById(id);
  $('titulo').textContent = 'Para ' + NOMBRE;
  $('bienvenida').textContent = BIENVENIDA;
  $('firma').textContent = 'Con todo mi cariño, ' + FIRMA + ' 🐶';

  const cont = $('secciones');
  SECCIONES.forEach(s => {
    const h = document.createElement('h2');
    h.textContent = s.emoji + ' ' + s.titulo;
    cont.appendChild(h);
    const g = document.createElement('div');
    g.className = 'grid';
    s.paginas.forEach(p => {
      const a = document.createElement('a');
      a.className = 'item';
      a.href = p.carpeta + '/index.html';
      a.innerHTML = '<span class="e"></span><b></b><span></span>';
      a.querySelector('.e').textContent = p.emoji;
      a.querySelector('b').textContent = p.titulo;
      a.querySelector('span:last-child').textContent = p.desc;
      g.appendChild(a);
    });
    cont.appendChild(g);
  });

  const fl = $('floaters');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span');
    s.textContent = ['❤', '💕', '💗', '♥'][i % 4];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (12 + Math.random() * 18) + 'px';
    s.style.animationDuration = (8 + Math.random() * 8) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    fl.appendChild(s);
  }
</script>
</body>
</html>
