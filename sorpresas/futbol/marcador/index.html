<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2416">
<title>Nosotros vs. Distancia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<script>
  // ✏️ PERSONALIZA AQUÍ ----------------------------------------------
  const EQUIPO = 'Carola y Owen';
  const FECHA_INICIO = '2026-10-08';          // cuándo "empezó el partido"
  const FECHA_FINAL = '2026-12-19T12:00:00';  // el día que se ven (silbatazo final)
  // Relato del partido: aparece según el minuto (0 a 90)
  const RELATO = [
    { min: 0,  texto: '¡Arranca el partido! Nosotros salimos con todo.' },
    { min: 10, texto: 'Primer gol: las llamadas de todas las noches ⚽' },
    { min: 25, texto: 'La Distancia intenta presionar… pero no pasa nada.' },
    { min: 40, texto: '¡Golazo de mensajes de buenos días!' },
    { min: 45, texto: 'Medio tiempo. Snoopy hace la porra 🐶📣' },
    { min: 60, texto: 'Segundo tiempo: la Distancia ya se ve cansada.' },
    { min: 75, texto: 'Gol de vestidor: los exámenes no nos pudieron.' },
    { min: 85, texto: 'Ya se ve diciembre en el horizonte 🎄' },
    { min: 90, texto: '¡FINAL! Ganamos. Nos vemos 💗' },
  ];
  // -------------------------------------------------------------------
</script>
<style>
  :root { --bg: #0f2416; --board: #0b0b0d; --text: #fff; --muted: #9fb7a6; --led: #ffcf3f; --red: #e8174f; --green: #2bd96b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: repeating-linear-gradient(180deg, #1c4a2a 0 70px, #18402a 70px 140px); color: var(--text);
    font-family: "Barlow Condensed", system-ui, sans-serif; min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
  }
  main { width: min(100%, 500px); margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  .board { background: var(--board); border-radius: 14px; padding: 16px 14px; box-shadow: 0 16px 40px rgba(0,0,0,.5); border: 3px solid #26262b; }
  .live { text-align: center; color: var(--red); font-weight: 800; letter-spacing: .2em; font-size: .85rem; }
  .live::before { content: "● "; animation: parp 1s infinite; }
  @keyframes parp { 50% { opacity: .2; } }
  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 8px; }
  .team { text-align: center; font-weight: 800; text-transform: uppercase; font-size: clamp(.95rem, 4.2vw, 1.15rem); line-height: 1.1; }
  .team .e { font-size: 2rem; display: block; }
  .goles { display: flex; gap: 6px; align-items: center; }
  .goles b {
    font-size: clamp(3rem, 15vw, 4.2rem); color: var(--led); font-variant-numeric: tabular-nums; line-height: 1;
    background: #18181c; border-radius: 8px; padding: 4px 12px; text-shadow: 0 0 12px rgba(255,207,63,.6); min-width: 1.4em; text-align: center;
  }
  .goles span { color: var(--muted); font-size: 2rem; }
  .min { text-align: center; margin-top: 10px; font-size: 1.4rem; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: #26262b; border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--led)); transition: width 1s; }
  .falta { text-align: center; color: var(--muted); margin-top: 6px; font-size: 1.05rem; }

  h2 { margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .08em; font-size: 1.1rem; color: #e4f1e8; }
  .relato { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 8px; }
  .relato li { background: rgba(0,0,0,.35); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: baseline; }
  .relato li b { color: var(--led); min-width: 34px; }
  .relato li span { font-family: "Caveat", cursive; font-size: 1.4rem; line-height: 1.15; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="board">
    <div class="live" id="live">EN VIVO</div>
    <div class="score">
      <div class="team"><span class="e">💗</span><span id="equipo"></span></div>
      <div class="goles"><b id="g1">0</b><span>-</span><b>0</b></div>
      <div class="team"><span class="e">🗺️</span>La Distancia</div>
    </div>
    <div class="min" id="min"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="falta" id="falta"></div>
  </div>
  <h2>Minuto a minuto</h2>
  <ul class="relato" id="relato"></ul>
</main>

<script>
  const $ = id => document.getElementById(id);
  $('equipo').textContent = EQUIPO;
  const ini = new Date(FECHA_INICIO + 'T00:00:00');
  const fin = new Date(FECHA_FINAL);

  function render() {
    const now = new Date();
    const p = Math.max(0, Math.min(1, (now - ini) / (fin - ini)));
    const minuto = Math.floor(p * 90);
    $('min').textContent = p >= 1 ? 'FINAL' : minuto + "'";
    $('bar').style.width = (p * 100) + '%';
    // un gol por cada semana que ya aguantamos
    $('g1').textContent = Math.floor((now - ini) / (7 * 86400000)) + (p >= 1 ? 1 : 0);
    const dias = Math.ceil((fin - now) / 86400000);
    $('falta').textContent = p >= 1 ? '¡Ganamos! 🏆' : 'Faltan ' + dias + (dias === 1 ? ' día' : ' días') + ' para el silbatazo final';
    if (p >= 1) $('live').textContent = 'FINAL DEL PARTIDO';

    const ul = $('relato');
    ul.innerHTML = '';
    RELATO.filter(r => r.min <= minuto || p >= 1).forEach(r => {
      const li = document.createElement('li');
      li.innerHTML = '<b></b><span></span>';
      li.querySelector('b').textContent = r.min + "'";
      li.querySelector('span').textContent = r.texto;
      ul.appendChild(li);
    });
  }
  render();
  setInterval(render, 60000);
</script>
<a class="volver-menu" href="../../index.html" style="position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:50;background:rgba(255,255,255,.88);color:#4a2b33;text-decoration:none;font:700 13px/1 system-ui,-apple-system,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18)">← Menú</a>
</body>
</html>
